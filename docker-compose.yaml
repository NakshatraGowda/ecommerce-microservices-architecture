version: "3.8"
services:
  eureka-server:
    build: ./sureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - ecommerce-net
  
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: API-GATEWAY
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-net

  kafka:
    image: bitnamilegacy/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT, CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPIC_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      # - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      
      # Crucial: Tell Kafka what addresses to advertise back to clients
      # KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      
      # Tell Kafka which listener brokers should use to talk to each other
      # KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ecommerce-net
    
  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - eureka-server
    environment:
      SERVER_PORT: 8088
      SPRING_APPLICATION_NAME: NOTIFICATION-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - ecommerce-net
  
  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: ORDER-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - ecommerce-net

  inventory-service:
    build: 
      context: .
      dockerfile: Dockerfile.inventory
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - order-service
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: INVENTORY-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - ecommerce-net
  
  payment-service:
    build: ./payment-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: PAYMENT-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-net

  product-service:
    build: ./product-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8085
      SPRING_APPLICATION_NAME: PRODUCT-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-net

  
  user-service:
    build: ./user-service
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8086
      SPRING_APPLICATION_NAME: USER-SERVICE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - ecommerce-net
    
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:

networks:
  ecommerce-net:
    driver: bridge